jobs: 100
keep-going: True
retries: 2
rerun-incomplete: True
software-deployment-method: apptainer
configfile: "config/config.yaml"
apptainer-args: "-e --cleanenv -B /projects -B /data -B /beegfs-storage -B /scratch  -B /beegfs-scratch -B /beegfs-scratch/wp4/Twist_Solid_tmp:/tmp"
apptainer-prefix: "/projects/wp4/nobackup/singularity_cache/"
# Requires the executor plugin: pip install snakemake-executor-plugin-drmaa
executor: drmaa
drmaa-args: " -A wp1 -N 1-1 -t {resources.time} -n {resources.threads} --mem={resources.mem_mb} --mem-per-cpu={resources.mem_per_cpu} --partition={resources.partition} -J {rule} -e slurm_out/{rule}_%j.err -o slurm_out/{rule}_%j.out"
drmaa-log-dir: "slurm_out"
default-resources: [threads=1, time="04:00:00", partition="low", mem_mb=3074, mem_per_cpu=3074]
