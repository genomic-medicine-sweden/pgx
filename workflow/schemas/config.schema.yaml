$schema: "http://json-schema.org/draft-04/schema#"
description: snakemake configuration file
type: object
properties:
  samples:
    type: string
  units:
    type: string
  resources:
    type: string
    description: Path to resources.yaml file
  default_container:
    type: string
    description: name or path to a default docker/singularity container
  hydra_local_path:
    type: string
    description: folder with local clones of the hydra-genetics modules, used instead of GitHub when set
  modules:
    type: object
    description: hydra-genetics module versions (git tags)
    properties:
      alignment:
        type: string
      prealignment:
        type: string
      snv_indels:
        type: string
    required:
      - alignment
      - prealignment
      - snv_indels
required:
  - samples
  - units
  - resources
  - default_container
  - modules

padd_target_regions:
    type: object
    description: parameters for padd_target_regions
    properties:
      benchmark_repeats:
        type: integer
        description: set number of times benchmark should be repeated
      container:
        type: string
        description: name or path to docker/singularity padd_target_regions
      padd_target_regions:
        type: string
        description: path to bed file with target target_regions
      padding:
        type: integer
        description: the number bases to add as padding to regions' start and end coordinates
